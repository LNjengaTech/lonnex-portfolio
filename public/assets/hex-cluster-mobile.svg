<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 840" width="100%" height="100%" fill="none">
  <!-- Minimalist Geometric UI Asset: Mobile Screen Hexagonal Wireframe Clusters -->
  <!-- Brand: The Hive / Lonnex Njenga -->
  <!-- Positioned specifically in the empty margin spaces flanking the mobile zig-zag column -->
  <defs>
    <filter id="dot-glow-mobile" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .wireframe-stroke {
        stroke: #0066FF;
        stroke-width: 0.55px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .wireframe-thin {
        stroke: #0066FF;
        stroke-width: 0.35px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
        opacity: 0.7;
      }
      .vertex-dot-glow {
        fill: #0066FF;
        filter: url(#dot-glow-mobile);
      }
      .vertex-dot-halo {
        fill: #0066FF;
        opacity: 0.3;
      }
    </style>
  </defs>

  <!-- ── 1. Top-Left Mobile Cluster (R = 52) ────────────────────────────── -->
  <!-- Hex M1: Center (55, 130), R = 52, W = 90.06 -->
  <!-- Points: (55, 78) (100.03, 104) (100.03, 156) (55, 182) (9.97, 156) (9.97, 104) -->
  <polygon points="55,78 100.03,104 100.03,156 55,182 9.97,156 9.97,104" class="wireframe-stroke" />

  <!-- Hex M2 (SE of M1): Center (100.03, 208), R = 52 -->
  <!-- Points: (100.03, 156) (145.06, 182) (145.06, 234) (100.03, 260) (55, 234) (55, 182) -->
  <!-- Shared edge with M1: (100.03, 156) to (55, 182) -->
  <polygon points="100.03,156 145.06,182 145.06,234 100.03,260 55,234 55,182" class="wireframe-stroke" />

  <!-- Connective guide line -->
  <line x1="55" y1="78" x2="9.97" y2="104" class="wireframe-thin" />

  <!-- M1 & M2 Dots at Shared Vertices (True Circles) -->
  <circle cx="100.03" cy="156" r="2.8" class="vertex-dot-halo" />
  <circle cx="100.03" cy="156" r="1.5" class="vertex-dot-glow" />

  <circle cx="55" cy="182" r="2.8" class="vertex-dot-halo" />
  <circle cx="55" cy="182" r="1.5" class="vertex-dot-glow" />

  <circle cx="55" cy="78" r="2.5" class="vertex-dot-halo" />
  <circle cx="55" cy="78" r="1.3" class="vertex-dot-glow" />

  <circle cx="145.06" cy="182" r="2.5" class="vertex-dot-halo" />
  <circle cx="145.06" cy="182" r="1.3" class="vertex-dot-glow" />

  <!-- ── 2. Mid-Right Mobile Cluster (R = 52) ───────────────────────────── -->
  <!-- Hex M3: Center (365, 270), R = 52 -->
  <!-- Points: (365, 218) (410.03, 244) (410.03, 296) (365, 322) (319.97, 296) (319.97, 244) -->
  <polygon points="365,218 410.03,244 410.03,296 365,322 319.97,296 319.97,244" class="wireframe-stroke" />

  <!-- Hex M4 (SW of M3): Center (319.97, 348), R = 52 -->
  <!-- Points: (319.97, 296) (365, 322) (365, 374) (319.97, 400) (274.94, 374) (274.94, 322) -->
  <!-- Shared edge with M3: (319.97, 296) to (365, 322) -->
  <polygon points="319.97,296 365,322 365,374 319.97,400 274.94,374 274.94,322" class="wireframe-stroke" />

  <!-- Connective guide line -->
  <line x1="365" y1="374" x2="319.97" y2="400" class="wireframe-thin" />

  <!-- M3 & M4 Dots at Shared Vertices (True Circles) -->
  <circle cx="319.97" cy="296" r="2.8" class="vertex-dot-halo" />
  <circle cx="319.97" cy="296" r="1.5" class="vertex-dot-glow" />

  <circle cx="365" cy="322" r="2.8" class="vertex-dot-halo" />
  <circle cx="365" cy="322" r="1.5" class="vertex-dot-glow" />

  <circle cx="365" cy="218" r="2.5" class="vertex-dot-halo" />
  <circle cx="365" cy="218" r="1.3" class="vertex-dot-glow" />

  <circle cx="274.94" cy="374" r="2.5" class="vertex-dot-halo" />
  <circle cx="274.94" cy="374" r="1.3" class="vertex-dot-glow" />

  <!-- ── 3. Lower-Left Mobile Cluster (R = 52) ──────────────────────────── -->
  <!-- Hex M5: Center (65, 600), R = 52 -->
  <!-- Points: (65, 548) (110.03, 574) (110.03, 626) (65, 652) (19.97, 626) (19.97, 574) -->
  <polygon points="65,548 110.03,574 110.03,626 65,652 19.97,626 19.97,574" class="wireframe-stroke" />

  <!-- Hex M6 (SE of M5): Center (110.03, 678), R = 52 -->
  <!-- Points: (110.03, 626) (155.06, 652) (155.06, 704) (110.03, 730) (65, 704) (65, 652) -->
  <!-- Shared edge with M5: (110.03, 626) to (65, 652) -->
  <polygon points="110.03,626 155.06,652 155.06,704 110.03,730 65,704 65,652" class="wireframe-stroke" />

  <!-- M5 & M6 Dots at Shared Vertices (True Circles) -->
  <circle cx="110.03" cy="626" r="2.8" class="vertex-dot-halo" />
  <circle cx="110.03" cy="626" r="1.5" class="vertex-dot-glow" />

  <circle cx="65" cy="652" r="2.8" class="vertex-dot-halo" />
  <circle cx="65" cy="652" r="1.5" class="vertex-dot-glow" />

  <circle cx="65" cy="548" r="2.5" class="vertex-dot-halo" />
  <circle cx="65" cy="548" r="1.3" class="vertex-dot-glow" />

  <circle cx="110.03" cy="730" r="2.5" class="vertex-dot-halo" />
  <circle cx="110.03" cy="730" r="1.3" class="vertex-dot-glow" />
</svg>
